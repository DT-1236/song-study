repos:
  # Pinned to the ruff the backend's venv installs, so the hook and the
  # `ruff format` AGENTS.md tells you to run can't disagree about a file.
  # Both are scoped to backend/, as AGENTS.md's `ruff format app tests
  # migrations` is: this ruff also formats Python inside markdown, which would
  # reflow the hand-aligned snippets in docs/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # Reports without rewriting: a --fix hook edits code mid-commit, and the
      # findings worth having are the ones you read (see the B023 and BLE001
      # in the adoption commit). `ruff check --fix` by hand is still fine.
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # The repo's own prettier, not pre-commit's mirror: the mirror is archived,
  # has no v3.1.1, and pins a prettier of its own that would fight the 3.9.8
  # in frontend/package.json. Scoped to frontend/, the only tree prettier is
  # configured for (.prettierrc.json and .prettierignore live there).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: frontend/node_modules/.bin/prettier --write
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]
