name: Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '.github/workflows/backend-tests.yml'

jobs:
  pytest:
    name: Pytest (Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: song_study
          POSTGRES_PASSWORD: song_study
          POSTGRES_DB: song_study
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U song_study"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/support.py refuses a test database that shares the app's name
      # or doesn't end in _test; it creates the test database itself.
      DATABASE_URL: postgresql+psycopg2://song_study:song_study@localhost:5432/song_study
      TEST_DATABASE_URL: postgresql+psycopg2://song_study:song_study@localhost:5432/song_study_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest
